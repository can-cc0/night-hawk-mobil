name: Unity lisans istegi
on:
  workflow_dispatch:

jobs:
  istek:
    name: Aktivasyon dosyasi uret
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-6000.0.40f1-android-3
    steps:
      - name: Elle aktivasyon dosyasi olustur
        run: |
          set +e
          unity-editor -batchmode -nographics -logFile /dev/stdout -createManualActivationFile -quit
          echo "--- uretilen dosyalar ---"
          ls -la *.alf 2>/dev/null || ls -la /*.alf 2>/dev/null || find / -maxdepth 3 -name "*.alf" 2>/dev/null
          mkdir -p /tmp/alf
          find / -maxdepth 4 -name "*.alf" -exec cp {} /tmp/alf/ \; 2>/dev/null
          ls -la /tmp/alf/

      - name: Dosyayi yukle
        uses: actions/upload-artifact@v4
        with:
          name: Unity_lisans_istegi
          path: /tmp/alf/*.alf
          if-no-files-found: error
