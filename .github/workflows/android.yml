name: Android APK

on:
  workflow_dispatch:

jobs:
  derle:
    name: APK derle
    runs-on: ubuntu-latest
    steps:
      - name: Diskte yer ac
        run: |
          echo "--- once ---"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          echo "--- sonra ---"; df -h / | tail -1

      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          lfs: false


      - name: Videolari WebM'e cevir
        run: |
          # Unity'nin Linux surumu mp4 okuyamiyor ("Error while reading movie"),
          # bu yuzden videolar hic ice aktarilamiyor ve ekran siyah kaliyor.
          # WebM/VP8 Linux editorde yerel olarak destekleniyor.
          # .meta dosyasi ayni guid ile yeniden adlandiriliyor ki sahnelerdeki
          # referanslar bozulmasin.
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1
          ffmpeg -version | head -1
          find Assets -name "*.mp4" -print0 | while IFS= read -r -d '' f; do
            hedef="${f%.mp4}.webm"
            echo "-> $f"
            ffmpeg -nostdin -y -loglevel error -i "$f" \
              -c:v libvpx -b:v 1800k -crf 30 -cpu-used 5 -deadline good \
              -vf "scale='min(1280,iw)':-2" \
              -c:a libvorbis -b:a 128k \
              "$hedef" || true
            if [ -s "$hedef" ]; then
              [ -f "$f.meta" ] && mv "$f.meta" "$hedef.meta"
              rm -f "$f"
              echo "   olustu: $(du -h "$hedef" | cut -f1)"
            else
              echo "   CEVIRME BASARISIZ, mp4 birakiliyor"
              rm -f "$hedef"
            fi
          done
          echo "--- sonuc ---"
          find Assets -name "*.webm" -o -name "*.mp4" | sed 's/^/   /'

      - name: Kutuphane onbellegi
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Unity ile derle
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.40f1
          targetPlatform: Android
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NightHawk-APK
          path: build/Android
          if-no-files-found: warn
